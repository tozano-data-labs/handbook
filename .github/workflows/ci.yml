name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"

  pr-title:
    if: github.event_name == 'pull_request'
    uses: tozano-data-labs/shared-workflows/.github/workflows/pr-title.yml@v1
